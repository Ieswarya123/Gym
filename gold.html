<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Checkout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
      color: #333;
    }

    .checkout-container {
      display: flex;
      justify-content: center;
      margin: 40px auto;
      max-width: 900px;
      gap: 30px;
    }

    .message-box, .order-summary {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      flex: 1;
    }

    .message-box h2 {
      color: #b22222;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .order-summary h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #333;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
.coupon {
    display: flex;
    width: 300px;
}

.coupon input {
    width: 200px;
    padding: 10px;
}

.coupon button {
    display: none;
    padding: 10px;
}

.coupon:focus-within button {
    display: block;
}

    .total {
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Secure Checkout💸💲</h1> <h1 style="color:#b22222">Gold Membership</h1>
    <nav>
      <a href="./plan.html">Home</a> 
    </nav>
  </header>

  <div class="checkout-container">
    <!-- Left Message -->
    <div class="message-box">
      <h2>We can’t accept online payments</h2>
      <p>Contact us for help with your order.</p>
    </div>

    <!-- Right Order Summary -->
    <div class="order-summary">
      <h2>Order Summary</h2>
      <div class="order-item">
        <span>Gold Membership</span>
        <span>$50.00 / month</span>
      </div>
      <p>Duration: 2 months</p>

      <div class="order-item">
        <span>Subtotal</span>
        <span>$50.00</span>
      </div>
      <div class="total">
        <span>Total</span>
        <span>$50.00</span>
      </div>
      <p style="margin-top:10px; font-size:13px; color:#555;">
        You’ll be charged $25.00 every month for 2 months.
      </p>
    </div>
  </div>
</body>
</html>
