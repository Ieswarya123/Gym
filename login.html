<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitZone Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Background Image */

        .background-img {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            filter: blur(6px);
            transform: scale(1.05);

            z-index: -2;
        }

        /* Dark Overlay */

        .overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.55);

            z-index: -1;
        }

        /* Login Box */

        .login-container {
            width: 380px;

            padding: 40px;

            background: rgba(20, 20, 20, 0.90);

            border: 1px solid rgba(255, 77, 0, 0.6);

            border-radius: 15px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);

            color: white;
        }

        /* Logo */

        .logo {
            text-align: center;

            color: #ff4d00;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .welcome {
            text-align: center;

            color: #ccc;

            margin-bottom: 30px;
        }

        /* Input */

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;

            margin-bottom: 8px;
        }

        .input-box input {
            width: 100%;

            padding: 13px;

            background: #222;

            color: white;

            border: 1px solid #555;

            border-radius: 6px;

            outline: none;
        }

        .input-box input:focus {
            border-color: #ff4d00;
        }

        /* Forgot Password */

        .forgot {
            text-align: right;

            margin-bottom: 20px;
        }

        .forgot a {
            color: #ff4d00;

            text-decoration: none;

            font-size: 14px;
        }

        /* Login Button */

        .login-btn {
            width: 100%;

            padding: 13px;

            background: #ff4d00;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #e64400;
        }

        /* Register */

        .register {
            text-align: center;

            color: #aaa;

            margin-top: 25px;

            font-size: 14px;
        }

        .register a {
            color: #ff4d00;

            text-decoration: none;

            font-weight: bold;
        }

        /* Mobile */

        @media (max-width: 450px) {

            .login-container {
                width: 90%;

                padding: 30px;
            }
        }

    </style>
</head>

<body>

    <!-- Background Image -->

    <img src="./login.jpg"
         class="background-img"
         alt="Gym Background">

    <div class="overlay"></div>


    <!-- Login Container -->

    <div class="login-container">

        <div class="logo">
            FitZone
        </div>

        <p class="welcome">
            Welcome back! Please login to continue.
        </p>


        <!-- Login Form -->

        <form onsubmit="loginUser(event)">

            <div class="input-box">

                <label>Email</label>

                <input type="email"
                       id="email"
                       placeholder="Enter your email">

            </div>


            <div class="input-box">

                <label>Password</label>

                <input type="password"
                       id="password"
                       placeholder="Enter your password">

            </div>

<!-- 
            <div class="forgot">

                <a href="./forgot-pass">
                    Forgot Password?
                </a>

            </div> -->


            <button type="submit" class="login-btn">
                Login
            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="./reg.html">
                Register
            </a>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        function loginUser(event) {

            // Stop the form from refreshing the page
            event.preventDefault();


            // Get email and password values

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;


            // Check empty fields

            if (email == "" || password == "") {

                alert("Please fill all the fields");

            }


            // Check login details

            else if (
                email == "ishu@gmail.com" &&
                password == "Ishu2006"
            ) {

                alert("Login successful");

                window.location.href = "./index.html";

            }


            // Wrong login details

            else {

                alert("Login failed");

            }

        }

    </script>

</body>

</html>
