<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews - FitZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background-color: black;
            color: white;
        }


        /* ================= NAVBAR ================= */

        .nav1 {

            color: white;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px;

            position: sticky;

            top: 0;

            background-color: #000000;

            z-index: 99999;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }


        .nav2 {

            display: flex;

            gap: 10px;

            align-items: center;
        }


        .logo {

            height: 80px;

            width: 80px;

            border-radius: 50%;

            object-fit: cover;
        }


        .nav3 {

            font-size: 20px;
        }


        .nav3 a {

            text-decoration: none;

            color: #FF4D00;

            margin: 0 3px;
        }


        .nav3 a:hover {

            color: white;
        }


        #rev {

            color: white;
        }


        /* ================= HEADING ================= */

        .head {

            color: white;

            text-align: center;

            font-size: 60px;

            margin-top: 60px;
        }


        .subhead {

            text-align: center;

            color: #ccc;

            font-size: 18px;

            margin-bottom: 50px;
        }


        /* ================= REVIEW SLIDER ================= */

        .review-section {

            width: 80%;

            max-width: 900px;

            margin: auto;
        }


        .review-card {

            background-color: white;

            color: black;

            border-radius: 15px;

            min-height: 300px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px;

            margin: 20px 60px;
        }


        .stars {

            color: #FF4D00;

            font-size: 30px;

            margin-bottom: 20px;
        }


        .review-text {

            font-size: 22px;

            font-style: italic;

            margin-bottom: 20px;
        }


        .review-name {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        .class-name {

            color: #FF4D00;

            font-size: 17px;
        }


        /* ================= CAROUSEL ARROWS ================= */

        .carousel-control-prev-icon,
        .carousel-control-next-icon {

            background-color: #FF4D00;

            border-radius: 50%;

            padding: 20px;

            background-size: 50%;
        }


        /* ================= INDICATORS ================= */

        .carousel-indicators [data-bs-target] {

            background-color: #FF4D00;
        }


        /* ================= WRITE REVIEW ================= */

        .write-review {

            text-align: center;

            margin-top: 80px;

            margin-bottom: 60px;
        }


        .write-review h2 {

            color: #FF4D00;

            margin-bottom: 20px;
        }


        .write-review p {

            color: #ccc;
        }


        .review-form {

            width: 80%;

            max-width: 600px;

            margin: auto;

            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        .review-form input,
        .review-form select,
        .review-form textarea {

            padding: 12px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }


        .review-form input:focus,
        .review-form select:focus,
        .review-form textarea:focus {

            outline: 2px solid #FF4D00;
        }


        .review-form textarea {

            height: 120px;

            resize: none;
        }


        .review-form button {

            background-color: #FF4D00;

            color: white;

            border: none;

            padding: 12px;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;
        }


        .review-form button:hover {

            background-color: white;

            color: black;
        }


        /* ================= FOOTER ================= */

        .vis {

            color: white;

            text-align: center;

            margin-top: 60px;

            padding-bottom: 30px;
        }


        .vis a {

            color: white;

            text-decoration: none;
        }


        .vis a:hover {

            color: #FF4D00;
        }


        /* ================= MOBILE ================= */

        @media screen and (max-width: 768px) {


            .nav1 {

                flex-direction: column;

                gap: 15px;
            }


            .nav3 {

                font-size: 14px;

                text-align: center;

                line-height: 30px;
            }


            .head {

                font-size: 40px;

                margin-top: 40px;
            }


            .subhead {

                font-size: 15px;
            }


            .review-section {

                width: 100%;
            }


            .review-card {

                margin: 20px 45px;

                min-height: 280px;

                padding: 25px;
            }


            .review-text {

                font-size: 18px;
            }


            .stars {

                font-size: 25px;
            }


            .carousel-control-prev-icon,
            .carousel-control-next-icon {

                padding: 15px;
            }


            .review-form {

                width: 90%;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="nav1">


        <div class="nav2">

            <img src="./logg.jpg"
                 alt="Logo"
                 class="logo">

            <h1>FitZone</h1>

        </div>


        <div class="nav3">

            <a href="./index.html">
                Home |
            </a>

            <a href="./about.html">
                About |
            </a>

            <a href="./plan.html">
                Plans |
            </a>

            <a href="./class.html">
                Classes |
            </a>

            <a href="./review.html"
               id="rev">
                Review
            </a>

        </div>

    </nav>



    <!-- ================= HEADING ================= -->

    <h2 class="head">
        What Our Members Say
    </h2>


    <p class="subhead">
        Real experiences from our fitness community
    </p>



    <!-- ================= REVIEW CAROUSEL ================= -->

    <div class="review-section">


        <div id="reviewCarousel"
             class="carousel slide"
             data-bs-ride="carousel">


            <!-- INDICATORS -->

            <div class="carousel-indicators"
                 id="reviewIndicators">
            </div>



            <!-- REVIEWS -->

            <div class="carousel-inner"
                 id="reviewCarouselInner">

            </div>



            <!-- PREVIOUS BUTTON -->

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#reviewCarousel"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon">
                </span>

                <span class="visually-hidden">
                    Previous
                </span>

            </button>



            <!-- NEXT BUTTON -->

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#reviewCarousel"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon">
                </span>

                <span class="visually-hidden">
                    Next
                </span>

            </button>


        </div>

    </div>



    <!-- ================= WRITE REVIEW ================= -->

    <div class="write-review">


        <h2>
            Write a Review
        </h2>


        <p>
            Share your experience with our classes
        </p>



        <div class="review-form">


            <!-- NAME -->

            <input type="text"
                   id="name"
                   placeholder="Your Name">



            <!-- CLASS -->

            <select id="className">

                <option value="">
                    Select Class
                </option>

                <option value="Base Endurance">
                    Base Endurance
                </option>

                <option value="Base Strength">
                    Base Strength
                </option>

                <option value="Base HIT">
                    Base HIT
                </option>

            </select>



            <!-- RATING -->

            <select id="rating">

                <option value="">
                    Select Rating
                </option>

                <option value="⭐⭐⭐⭐⭐">
                    ⭐⭐⭐⭐⭐
                </option>

                <option value="⭐⭐⭐⭐">
                    ⭐⭐⭐⭐
                </option>

                <option value="⭐⭐⭐">
                    ⭐⭐⭐
                </option>

                <option value="⭐⭐">
                    ⭐⭐
                </option>

                <option value="⭐">
                    ⭐
                </option>

            </select>



            <!-- REVIEW -->

            <textarea id="reviewText"
                      placeholder="Write your review"></textarea>



            <!-- SUBMIT -->

            <button type="button"
                    onclick="addReview()">

                Submit Review

            </button>


        </div>

    </div>



    <!-- ================= FOOTER ================= -->

    <div class="vis">

        <a href="./privacy.html">
            Privacy Policy
        </a>

        |

        <a href="./refund.html">
            Refund Policy
        </a>

        |

        <a href="./term.html">
            Terms and Condition
        </a>

        |

        fitzone1232@gmail.com

    </div>



    <!-- ================= BOOTSTRAP JS ================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- ================= REVIEW JAVASCRIPT ================= -->

    <script>


        /* ==========================================
           LOAD REVIEWS WHEN PAGE OPENS
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            loadReviews
        );



        /* ==========================================
           ADD NEW REVIEW
        ========================================== */

        function addReview() {


            let name =
                document.getElementById("name").value.trim();


            let className =
                document.getElementById("className").value;


            let rating =
                document.getElementById("rating").value;


            let reviewText =
                document.getElementById("reviewText").value.trim();



            /* CHECK EMPTY FIELDS */

            if (
                name == "" ||
                className == "" ||
                rating == "" ||
                reviewText == ""
            ) {

                alert("Please give the review");

                return;
            }



            /* GET OLD REVIEWS */

            let reviews =
                JSON.parse(
                    localStorage.getItem("reviews")
                ) || [];



            /* CREATE NEW REVIEW */

            let newReview = {

                name: name,

                className: className,

                rating: rating,

                reviewText: reviewText

            };



            /* ADD NEW REVIEW TO ARRAY */

            reviews.push(newReview);



            /* SAVE TO LOCAL STORAGE */

            localStorage.setItem(
                "reviews",
                JSON.stringify(reviews)
            );



            /* DISPLAY REVIEWS */

            loadReviews();



            /* CLEAR FORM */

            document.getElementById("name").value = "";

            document.getElementById("className").value = "";

            document.getElementById("rating").value = "";

            document.getElementById("reviewText").value = "";



            alert("Review submitted successfully!");

        }



       function loadReviews() {

    let reviews =
        JSON.parse(localStorage.getItem("reviews")) || [];


    // Default 3 reviews
    if (reviews.length == 0) {

        reviews = [

            {
                name: "Priya",
                className: "Base Strength",
                rating: "⭐⭐⭐⭐⭐",
                reviewText: "Amazing workout class! The trainer was very supportive."
            },

            {
                name: "Arun",
                className: "Base Endurance",
                rating: "⭐⭐⭐⭐",
                reviewText: "Great trainers and good atmosphere. I really enjoyed it."
            },

            {
                name: "Ishika",
                className: "Base HIT",
                rating: "⭐⭐⭐⭐⭐",
                reviewText: "Very energetic workout session! Highly recommended."
            }

        ];

        // Save default reviews
        localStorage.setItem(
            "reviews",
            JSON.stringify(reviews)
        );
    }


    let carousel =
        document.getElementById("reviewCarouselInner");

    let indicators =
        document.getElementById("reviewIndicators");


    carousel.innerHTML = "";

    indicators.innerHTML = "";


    reviews.forEach(function(review, index) {

        let newReview =
            document.createElement("div");

        newReview.className = "carousel-item";


        if (index == 0) {
            newReview.classList.add("active");
        }


        newReview.innerHTML = `

            <div class="review-card">

                <div class="stars">
                    ${review.rating}
                </div>

                <p class="review-text">
                    "${review.reviewText}"
                </p>

                <p class="review-name">
                    — ${review.name}
                </p>

                <p class="class-name">
                    ${review.className}
                </p>

            </div>

        `;


        carousel.appendChild(newReview);


        // Create indicator

        let indicator =
            document.createElement("button");

        indicator.type = "button";

        indicator.setAttribute(
            "data-bs-target",
            "#reviewCarousel"
        );

        indicator.setAttribute(
            "data-bs-slide-to",
            index
        );


        if (index == 0) {
            indicator.classList.add("active");
        }


        indicators.appendChild(indicator);

    });

}

    </script>


</body>

</html>
