<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registration  </title>
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow-x: hidden;
        }
        .nav1 {
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: sticky;
            top: 0;
            background-color: #000000;
            z-index: 99999;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .nav2 {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .logo {
            height: 80px;
            width: 80px;
            border-radius: 50%;
        }

        .nav2 h1 {
            margin: 0;
        }

        .nav3 {
            font-size: 20px;
        }

        .nav3 a {
            text-decoration: none;
            color: #FF4D00;
        }

        .nav3 a:hover {
            color: white;
        }

        #reg {
            color: white;
        }
        #field {
            width: 700px;
            min-height: 600px;
            background-color: white;
            border: 5px solid grey;
            text-align: center;
            margin: 5% auto;
            padding: 5px;
        }

        #form {
            color: orangered;
            font-family: 'Lucida Sans',
                'Lucida Sans Regular',
                'Lucida Grande',
                'Lucida Sans Unicode',
                Geneva,
                Verdana,
                sans-serif;

            font-size: 30px;
            font-weight: bolder;
        }
        form {
            width: 500px;
            margin: 20px auto;
        }

        .logo1 {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo1 .logo {
            height: 60px;
            width: 60px;
        }

        .logo1 h1 {
            color: black;
            font-size: 25px;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-row label {
            width: 130px;
            text-align: right;
            margin-right: 10px;
            color: black;
            font-size: 15px;
        }

        .form-row input,
        .form-row select,
        .form-row textarea {
            width: 260px;
            box-sizing: border-box;
        }

        .form-row input,
        .form-row select {
            height: 32px;
        }



        .gender {
            display: flex;
            align-items: center;
            width: 260px;
            color: black;
        }

        .gender input[type="radio"] {
            width: auto;
            margin: 0 15px 0 5px;
        }


      

        textarea {
            height: 80px;
            resize: none;
        }


        
        input:focus,
        select:focus,
        textarea:focus {
            background-color: aquamarine;
        }
        .but {
            border: solid 2px black;
            color: black;
            width: 100px;
            height: 35px;
            border-radius: 3px;
            cursor: pointer;
        }

        .but:hover {
            background-color: blue;
            color: white;
        }

        .but1 {
            border: solid 2px black;
            color: black;
            width: 100px;
            height: 35px;
            border-radius: 3px;
            margin-left: 30px;
            cursor: pointer;
        }

        .but1:hover {
            background-color: blue;
            color: white;
        }
        @media screen and (min-width: 601px) and (max-width: 900px) {

            .nav1 {
                padding: 15px;
            }

            .logo {
                width: 65px;
                height: 65px;
            }

            .nav3 a {
                font-size: 19px;
            }

            #field {
                width: 90%;
                margin: 5% auto;
            }

            form {
                width: 500px;
                max-width: 100%;
            }

        }
        @media screen and (max-width: 600px) {

            body {
                width: 100%;
                overflow-x: hidden;
            }
            .nav1 {
                padding: 10px;
                flex-direction: column;
                gap: 10px;
            }

            .nav2 {
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .nav2 h1 {
                font-size: 28px;
            }

            .nav3 {
                width: 100%;
                text-align: center;
                line-height: 2;
            }

            .nav3 a {
                font-size: 20px;
            }
            #field {
                width: 95%;
                min-height: auto;
                margin: 30px auto;
                padding: 5px;
            }

            #form {
                font-size: 25px;
            }
            form {
                width: 100%;
                margin: 15px auto;
                padding: 5px;
            }
            .logo1 {
                width: 100%;
                height: auto;
                margin-bottom: 20px;
            }

            .logo1 .logo {
                width: 55px;
                height: 55px;
            }

            .logo1 h1 {
                font-size: 22px;
            }
            .form-row {
                display: flex;
                align-items: center;
                width: 100%;
                margin-bottom: 15px;
            }

            .form-row label {
                width: 105px;
                min-width: 105px;
                text-align: right;
                margin-right: 8px;
                font-size: 13px;
            }
            .form-row input,
            .form-row select,
            .form-row textarea {
                width: calc(100% - 113px);
                min-width: 0;
            }
            .form-row input,
            .form-row select {
                height: 32px;
            }
            .gender {
                width: calc(100% - 113px);
                display: flex;
                align-items: center;
                font-size: 13px;
                white-space: nowrap;
            }
            .gender input[type="radio"] {
                width: auto;
                margin-left: 5px;
                margin-right: 10px;
            }
            textarea {
                height: 70px;
            }
            .but,
            .but1 {
                width: 90px;
                height: 35px;
            }

            .but1 {
                margin-left: 15px;
            }
        }

    </style>
</head>


<body>


    <!-- NAVBAR -->

    <nav class="nav1">

        <div class="nav2">

            <img src="./logg.jpg" alt="Logo" class="logo">

            <h1>FitZone</h1>

        </div>


        <div class="nav3">

            <a href="index.html" target="_self">
                Home |
            </a>

            <a href="./about.html">
                About |
            </a>

            <a href="plan.html">
                Plans |
            </a>

            <a href="./class.html">
                Classes |
            </a>

            <a href="reg.html" id="reg">
                Registration |
            </a>
             <a href="./review.html">Review</a>
        </div>

    </nav>


    <!-- REGISTRATION FORM -->

    <div class="form">

        <fieldset id="field">

            <legend id="form">
                FitZone
            </legend>


            <form>


                <div class="logo1">

                    <img src="./logg.jpg"
                        alt="Logo"
                        class="logo">

                    <h1>
                        FitZone
                    </h1>

                </div>



                <div class="form-row">

                    <label>
                        Name :
                    </label>

                    <input type="text" id="name" class="form-control" placeholder="Enter name">

                </div>


                <div class="form-row">

                    <label>
                        Email :
                    </label>

                    <input type="email" id="email" class="form-control" placeholder="Enter email">

                </div>



                <div class="form-row">

                    <label>
                        Gender :
                    </label>

                    <div class="gender">
                        Male
                        <input  type="radio"
                            name="gender">

                        Female
                        <input type="radio"
                            name="gender">

                    </div>

                </div>


             
                <div class="form-row">

                    <label>
                        Ph Number :
                    </label>

                    <input type="number" id="phone" class="form-control" placeholder="Enter number">

                </div>



                <div class="form-row">

                    <label>
                        Age :
                    </label>

                    <input type="number" id="age" class="form-control" placeholder="Enter age">

                </div>
             <div class="form-row">

                    <label>
                        Membership :
                    </label>

                    <select id="member" class="form-select">

                        <option>
                            1 month
                        </option>

                        <option>
                            3 months
                        </option>

                        <option>
                            6 months
                        </option>

                        <option>
                            1 year
                        </option>

                    </select>

                </div>
           
                <div class="form-row">

                    <label>
                        Starting date :
                    </label>

                    <input type="date" id="stdate" class="form-control">

                </div>
                <div class="form-row">

                    <label>
                        Ending date :
                    </label>

                    <input type="date"  id="edate" class="form-control">

                </div>



                <div class="form-row">

                    <label>
                        Address :
                    </label>

                    <textarea  id="address"  class="form-control"></textarea>
                </div>
                <br>
                <button type="button" class="btn btn-success" onclick="alertfg()">Submit</button>
                <button type="reset" class="btn btn-success">Clear</button>
            </form>
        </fieldset>
    </div>
      <script>
        function alertfg(){
            let name=document.getElementById("name").value;
            let email=document.getElementById("email").value;
            let phone=document.getElementById("phone").value;
            let age=document.getElementById("age").value;
            let member=document.getElementById("member").value;
            let stdate=document.getElementById("stdate").value;
            let edate=document.getElementById("edate").value;
            let address=document.getElementById("address").value;
            
           let gender = document.querySelector('input[name="gender"]:checked');
           if(name=="" || email=="" || phone=="" || age=="" || member=="" || stdate==""
            && edate=="" || address=="" || gender==null)
     {
        alert("Please  fill all the fields ☹️☹️");
     }
     else{
        alert("Registration Successfull 🎉");
        document.querySelector("form").reset();
     }
           
        }
      </script>

   


</body>

</html>
