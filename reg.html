<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>FitZone Registration</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: black;
            overflow-x: hidden;
        }


        /* ================= NAVBAR ================= */

        .nav1 {
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 30px;

            background-color: #000;

            position: sticky;
            top: 0;

            z-index: 1000;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
        }


        .nav2 {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .logo {
            width: 65px;
            height: 65px;

            border-radius: 50%;

            object-fit: cover;
        }


        .nav2 h1 {
            margin: 0;
            font-size: 28px;
        }


        .nav3 {
            font-size: 18px;
        }


        .nav3 a {
            text-decoration: none;
            color: #ff4d00;
            margin: 0 5px;
        }


        .nav3 a:hover {
            color: white;
        }


        #reg {
            color: white;
        }


        /* ================= BACKGROUND ================= */

        .background-img {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            filter: blur(7px);

            transform: scale(1.05);

            z-index: -2;
        }


        .overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.65);

            z-index: -1;
        }


        /* ================= FORM CONTAINER ================= */

        .form-container {

            width: 650px;

            max-width: 90%;

            margin: 50px auto;

            padding: 35px 45px;

            background: rgba(20, 20, 20, 0.92);

            border: 1px solid rgba(255, 77, 0, 0.7);

            border-radius: 18px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(255, 77, 0, 0.15);

            color: white;
        }


        /* ================= TITLE ================= */

        .form-title {

            text-align: center;

            margin-bottom: 30px;
        }


        .form-title img {

            width: 65px;
            height: 65px;

            border-radius: 50%;

            object-fit: cover;

            margin-bottom: 10px;
        }


        .form-title h1 {

            color: #ff4d00;

            font-size: 30px;

            margin-bottom: 5px;
        }


        /* ================= INPUT ROW ================= */

        .form-row {

            display: flex;

            align-items: center;

            margin-bottom: 18px;
        }


        .form-row > label {

            width: 150px;

            color: white;

            font-size: 15px;

            font-weight: 500;
        }


        /* Text input, select and textarea */

        .form-row > input,
        .form-row > select,
        .form-row > textarea {

            flex: 1;

            padding: 11px 12px;

            background: #222;

            color: white;

            border: 1px solid #555;

            border-radius: 6px;

            outline: none;
        }


        .form-row > input:focus,
        .form-row > select:focus,
        .form-row > textarea:focus {

            border-color: #ff4d00;

            box-shadow: 0 0 5px rgba(255, 77, 0, 0.4);
        }


        input::placeholder,
        textarea::placeholder {

            color: #888;
        }


        /* ================= GENDER ================= */

        .gender {

            flex: 1;

            display: flex;

            align-items: center;

            gap: 8px;

            color: white;
        }


        .gender input[type="radio"] {

            width: 16px;

            height: 16px;

            flex: 0 0 auto;

            padding: 0;

            margin: 0 8px 0 0;

            accent-color: #ff4d00;

            cursor: pointer;
        }


        .gender span {

            cursor: default;
        }


        /* ================= TEXTAREA ================= */

        textarea {

            min-height: 90px;

            resize: vertical;
        }


        /* ================= BUTTONS ================= */

        .button-container {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 25px;
        }


        .submit-btn,
        .clear-btn {

            width: 120px;

            padding: 11px;

            border: none;

            border-radius: 6px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .submit-btn {

            background: #ff4d00;

            color: white;
        }


        .submit-btn:hover {

            background: #e64400;

            transform: translateY(-2px);
        }


        .clear-btn {

            background: #444;

            color: white;
        }


        .clear-btn:hover {

            background: #666;

            transform: translateY(-2px);
        }


        /* ================= BACK TO LOGIN ================= */

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #aaa;

            text-decoration: none;

            font-size: 14px;
        }


        .back:hover {

            color: #ff4d00;
        }


        /* ================= MOBILE ================= */

        @media screen and (max-width: 700px) {

            .nav1 {

                flex-direction: column;

                gap: 12px;

                padding: 12px;
            }


            .nav3 {

                text-align: center;

                line-height: 2;
            }


            .form-container {

                width: 92%;

                padding: 25px 20px;

                margin: 30px auto;
            }


            .form-row {

                flex-direction: column;

                align-items: stretch;

                gap: 7px;
            }


            .form-row > label {

                width: 100%;

                font-size: 14px;
            }


            .form-row > input,
            .form-row > select,
            .form-row > textarea {

                width: 100%;
            }


            .gender {

                width: 100%;
            }


            .form-title h1 {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= BACKGROUND IMAGE ================= -->

    <img src="./signup.jpg"
         class="background-img"
         alt="Gym Background">

    <div class="overlay"></div>



    <!-- ================= REGISTRATION FORM ================= -->

    <div class="form-container">


        <div class="form-title">

            <img src="./logg.jpg"
                 alt="FitZone Logo">

            <h1>FitZone Registration</h1>

        </div>



        <form>


            <!-- NAME -->

            <div class="form-row">

                <label>Name :</label>

                <input type="text"
                       id="name"
                       placeholder="Enter your name">

            </div>



            <!-- EMAIL -->

            <div class="form-row">

                <label>Email :</label>

                <input type="email"
                       id="email"
                       placeholder="Enter your email">

            </div>



            <!-- GENDER -->

            <div class="form-row">

                <label>Gender :</label>

                <div class="gender">

                    <span>Male</span>

                    <input type="radio"
                           name="gender"
                           value="Male">


                    <span>Female</span>

                    <input type="radio"
                           name="gender"
                           value="Female">

                </div>

            </div>



            <!-- PHONE -->

            <div class="form-row">

                <label>Phone Number :</label>

                <input type="tel"
                       id="phone"
                       maxlength="10"
                       pattern="[0-9]{10}"
                       placeholder="Enter 10 digit number">

            </div>



            <!-- AGE -->

            <div class="form-row">

                <label>Age :</label>

                <input type="number"
                       id="age"
                       placeholder="Enter your age">

            </div>



            <!-- ADDRESS -->

            <div class="form-row">

                <label>Address :</label>

                <textarea id="address"
                          placeholder="Enter your address"></textarea>

            </div>



            <!-- BUTTONS -->

            <div class="button-container">

                <button type="button"
                        class="submit-btn"
                        onclick="alertfg()">

                    Submit

                </button>


                <button type="reset"
                        class="clear-btn">

                    Clear

                </button>

            </div>


            <!-- BACK TO LOGIN -->

            <a href="./login.html"
               class="back">

                ← Back to Login

            </a>


        </form>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function alertfg() {


            let name =
                document.getElementById("name").value;


            let email =
                document.getElementById("email").value;


            let phone =
                document.getElementById("phone").value;


            let age =
                document.getElementById("age").value;


            let address =
                document.getElementById("address").value;


            let gender =
                document.querySelector(
                    'input[name="gender"]:checked'
                );


            /* Check empty fields */

            if (
                name == "" ||
                email == "" ||
                phone == "" ||
                age == "" ||
                address == "" ||
                gender == null
            ) {

                alert(
                    "Please fill all the fields ☹️"
                );

            }


            else {

                alert(
                    "Registration Successful 🎉"
                );

                document.querySelector("form").reset();

            }

        }

    </script>


</body>

</html>
